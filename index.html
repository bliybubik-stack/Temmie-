<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>tEm tAlK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="w-full max-w-md phone-glass p-6 relative overflow-hidden" id="phoneContainer">
    <div class="flex justify-between items-center text-gray-400 text-sm font-semibold mb-4">
      <span class="tracking-wide">tEm tAlK</span>
      <div class="flex space-x-1.5 items-center">
        <div class="w-4 h-4 border border-gray-500 rounded-full flex items-center justify-center">
          <span class="block w-2 h-2 bg-gray-400 rounded-full"></span>
        </div>
        <span class="text-[10px] tracking-widest opacity-70">●●●●●</span>
      </div>
    </div>

    <div class="flex justify-between items-end mb-4">
      <h1 class="text-2xl font-bold text-white tracking-tight">Temmie</h1>
      <div class="w-10 h-10 bg-gray-600 border border-gray-500 avatar overflow-hidden">
        <img src="https://i.pravatar.cc/100?img=12" alt="Avatar" class="w-full h-full object-cover grayscale">
      </div>
    </div>

    <div class="glass-deep p-4 mb-4 flex items-center gap-3">
      <div class="relative w-14 h-14 status-frame flex-shrink-0">
        <img id="moodImage" src="images/happy.png" alt="Temmie mood" class="w-full h-full object-contain grayscale" />
      </div>
      <div class="flex-1">
        <p class="text-white text-sm font-medium">tEm sTaTuS</p>
        <p id="statusText" class="text-gray-400 text-xs">tEm iS rEaDy...</p>
      </div>
      <div class="w-8 h-8 glass flex items-center justify-center no-tilt">
        <i class="fas fa-circle text-[6px] text-gray-500"></i>
      </div>
    </div>

    <div class="glass p-3 mb-4 flex items-center gap-2">
      <i class="fas fa-key text-gray-500 text-xs"></i>
      <input type="password" id="apiKeyInput" placeholder="OpenRouter key" class="flex-1 bg-transparent border-none outline-none text-white text-sm placeholder-gray-500" />
      <button id="saveKeyBtn" class="glass px-4 py-1.5 text-xs text-gray-300 hover:text-white transition">Save</button>
    </div>

    <div class="glass-deep p-4 mb-4 flex-1 chat-wrapper">
      <div id="chatContainer" class="flex flex-col gap-3"></div>
    </div>

    <div class="glass p-2 flex items-center gap-2">
      <input type="text" id="userInput" placeholder="tYpE hOI..." class="flex-1 bg-transparent border-none outline-none text-white text-sm placeholder-gray-500 px-2" autofocus />
      <button id="sendBtn" class="glass w-10 h-10 flex items-center justify-center text-gray-300 hover:text-white transition">
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <script src="prompt.js"></script>
  <script src="behavior.js"></script>
  <script src="app.js"></script>
</body>
</html>
