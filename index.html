<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>tEm tAlK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone-glass">
    <div class="status-bar">
      <span class="tracking-wide">tEm tAlK</span>
      <div class="flex items-center gap-3">
        <i class="fas fa-circle text-[6px] text-gray-500"></i>
        <span class="text-[10px] tracking-widest opacity-70">●●●●●</span>
      </div>
    </div>

    <div class="key-row">
      <input type="password" id="apiKeyInput" placeholder="OpenRouter key" value="" />
      <button id="saveKeyBtn"><i class="fas fa-key"></i> save</button>
    </div>

    <div class="chat-wrapper">
      <div id="chatContainer" class="chat-container"></div>
    </div>

    <div id="statusBar" class="status-bar-bottom">
      <div class="status-frame">
        <img id="moodImage" src="images/happy.png" alt="Temmie mood" />
      </div>
      <span id="statusText">tEm iS lIsTeNinG...</span>
    </div>

    <div class="input-wrapper">
      <input type="text" id="userInput" placeholder="tYpE hOI..." autofocus />
      <button id="sendBtn"><i class="fas fa-arrow-right"></i></button>
    </div>
  </div>

  <script src="prompt.js"></script>
  <script src="app.js"></script>
</body>
</html>
