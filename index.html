<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>tEm tAlK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="w-full max-w-md phone-glass p-6 relative overflow-hidden" id="phoneContainer">
    <div class="flex justify-between items-center text-gray-400 text-sm font-semibold mb-4">
      <span class="tracking-wide">tEm tAlK</span>
    </div>

    <div class="flex justify-between items-end mb-4">
      <h1 class="text-2xl font-bold text-white tracking-tight">Temmie</h1>
    </div>

    <div class="glass-deep p-4 mb-4 flex items-center gap-3">
      <div class="relative w-14 h-14 status-frame flex-shrink-0">
        <img id="moodImage" src="images/happy.png" alt="Temmie mood" class="w-full h-full object-contain grayscale" />
      </div>
      <div class="flex-1">
        <p class="text-white text-sm font-medium">TeMm MoOD!!!</p>
        <p id="statusText" class="text-gray-400 text-xs">tEm iS rEaDy...</p>
      </div>
    </div>

    <div class="glass p-3 mb-4 flex items-center gap-2">
      <i class="fas fa-key text-gray-500 text-xs"></i>
      <input type="text" id="apiKeyInput" placeholder="OpenRouter key" class="flex-1 bg-transparent border-none outline-none text-white text-sm placeholder-gray-500" autocomplete="off" data-lpignore="true" data-form-type="other" />
      <button id="saveKeyBtn" class="glass px-4 py-1.5 text-xs text-gray-300 hover:text-white transition">Save</button>
    </div>

    <div class="glass-deep p-4 mb-4 flex-1 chat-wrapper">
      <div id="chatContainer" class="flex flex-col gap-3"></div>
    </div>

    <div class="glass p-2 flex items-center gap-2">
      <input
        type="text"
        id="userInput"
        name="chat-message"
        placeholder="tYpE hOI..."
        class="flex-1 bg-transparent border-none outline-none text-white text-sm placeholder-gray-500 px-2"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        data-form-type="other"
        data-lpignore="true"
      />
      <button id="sendBtn" class="glass w-10 h-10 flex items-center justify-center text-gray-300 hover:text-white transition">
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('input').forEach(function(input) {
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('data-lpignore', 'true');
        input.setAttribute('data-form-type', 'other');
      });
      
      const style = document.createElement('style');
      style.textContent = `
        input::-webkit-credentials-auto-fill-button,
        input::-webkit-credentials-auto-fill-button:hover,
        input::-webkit-credentials-auto-fill-button:active,
        input::-webkit-credentials-auto-fill-button:focus {
          display: none !important;
          visibility: hidden !important;
          pointer-events: none !important;
          opacity: 0 !important;
          width: 0 !important;
          height: 0 !important;
        }
        
        input[autocomplete="off"]::-webkit-credentials-auto-fill-button {
          display: none !important;
        }
        
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px rgba(16, 16, 18, 0.55) inset !important;
          -webkit-text-fill-color: #f0f0f0 !important;
          transition: background-color 5000s ease-in-out 0s !important;
        }
      `;
      document.head.appendChild(style);
    });
  </script>

  <script src="prompt.js"></script>
  <script src="behavior.js"></script>
  <script src="app.js"></script>
</body>
</html>
