<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>tEm tAlK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="w-full max-w-md phone-glass p-6 relative overflow-hidden" id="phoneContainer">
    <div class="flex justify-between items-center text-gray-400 text-sm font-semibold mb-4">
      <span class="tracking-wide">tEm tAlK</span>
      <div class="flex space-x-1.5 items-center">
        <div class="w-4 h-4 border border-gray-500 rounded-full flex items-center justify-center">
          <span class="block w-2 h-2 bg-gray-400 rounded-full"></span>
        </div>
        <span class="text-[10px] tracking-widest opacity-70">●●●●●</span>
      </div>
    </div>

    <div class="flex gap-2 mb-4">
      <input type="password" id="apiKeyInput" placeholder="OpenRouter key" class="flex-1 bg-[rgba(30,30,32,0.35)] backdrop-blur-[12px] saturate-[0.8] border border-[rgba(200,200,200,0.08)] rounded-[0.5rem] px-4 py-2.5 text-sm outline-none text-[#f0f0f0] placeholder-[#666]" />
      <button id="saveKeyBtn" class="bg-[rgba(30,30,32,0.35)] backdrop-blur-[12px] saturate-[0.8] border border-[rgba(200,200,200,0.08)] rounded-[0.5rem] px-4 py-2.5 text-[#f0f0f0] text-sm font-medium transition hover:bg-[rgba(255,255,255,0.06)] flex items-center gap-2">
        <i class="fas fa-key text-xs"></i> save
      </button>
    </div>

    <div class="glass-deep p-4 mb-3" style="flex:1; min-height:300px; max-height:450px; overflow-y:auto;">
      <div id="chatContainer" class="flex flex-col gap-2.5"></div>
    </div>

    <div class="flex items-center gap-3 mb-3 px-1">
      <div class="w-11 h-11 bg-[rgba(22,22,24,0.5)] backdrop-blur-[16px] saturate-[0.6] border border-[rgba(180,180,180,0.06)] rounded-[0.5rem] flex items-center justify-center p-1.5 flex-shrink-0">
        <img id="moodImage" src="images/happy.png" alt="Temmie mood" class="w-full h-full object-contain grayscale" />
      </div>
      <span id="statusText" class="text-sm text-[#a0a0a0] font-normal tracking-wide">tEm iS lIsTeNinG...</span>
    </div>

    <div class="flex items-center bg-[rgba(22,22,24,0.5)] backdrop-blur-[16px] saturate-[0.6] border border-[rgba(180,180,180,0.06)] rounded-[0.5rem] p-1">
      <input type="text" id="userInput" placeholder="tYpE hOI..." class="flex-1 bg-transparent border-none px-4 py-3.5 text-[15px] outline-none text-[#f0f0f0] placeholder-[#666]" autofocus />
      <button id="sendBtn" class="w-12 h-12 bg-[rgba(255,255,255,0.06)] border border-[rgba(255,255,255,0.06)] rounded-[0.5rem] text-[#f0f0f0] text-lg transition hover:bg-[rgba(255,255,255,0.1)] flex items-center justify-center flex-shrink-0">
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <script src="prompt.js"></script>
  <script src="app.js"></script>
  <script src="behavior.js"></script>
</body>
</html>
